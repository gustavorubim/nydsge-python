[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nydsge"
version = "0.1.0"
description = "Native Python port of the New York Fed DSGE model workflow."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "nydsge contributors" }]
dependencies = [
    "h5py>=3.11",
    "numpy>=1.26",
    "pandas>=2.2",
    "rich>=13.7",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.optional-dependencies]
cpu = []
torch = ["torch>=2.3"]
jax = ["jax>=0.4.31"]
jax-linux-cuda = ["jax[cuda12]>=0.4.31; platform_system == 'Linux'"]
dev = [
    "pytest>=8.2",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "ty>=0.0.1a8",
]

[project.scripts]
nydsge = "nydsge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nydsge"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "ty>=0.0.1a8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
